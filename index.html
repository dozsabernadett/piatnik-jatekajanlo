<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piatnik Játékajánló</title>
<style>
  :root {
    --red:#C80A0D; --red2:#a20009;
    --bg:#fef8f8; --white:#fff;
    --text:#1a1a1a; --muted:#777; --border:#eee;
    --r:16px; --sh:0 4px 24px rgba(200,10,13,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:16px 12px 32px;color:var(--text);
  }
  .wrap{width:100%;max-width:560px;}

  /* HEADER */
  .hdr{text-align:center;padding:22px 0 16px;}
  .brand{font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--red);}
  .hdr-sub{font-size:12px;color:#bbb;margin-top:2px;}

  /* DOTS */
  .dots{display:flex;gap:8px;justify-content:center;margin-bottom:18px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#e0e0e0;transition:.25s ease;}
  .dot.done{background:#f5bfbf;}
  .dot.active{background:var(--red);transform:scale(1.45);}

  /* CARD */
  .card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);padding:28px 24px;animation:fu .3s ease;}
  @keyframes fu{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

  /* START */
  .s-emoji{font-size:52px;display:block;text-align:center;margin-bottom:14px;}
  .s-title{font-size:24px;font-weight:800;text-align:center;line-height:1.25;margin-bottom:10px;}
  .s-desc{font-size:14px;color:var(--muted);text-align:center;line-height:1.7;margin-bottom:24px;}
  .btn-go{
    display:block;width:100%;background:var(--red);color:white;border:none;
    border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s;
  }
  .btn-go:hover{background:var(--red2);transform:translateY(-2px);}
  .s-note{text-align:center;font-size:12px;color:#ccc;margin-top:10px;}

  /* QUESTION */
  .q-emoji{font-size:38px;display:block;text-align:center;margin-bottom:10px;}
  .q-text{font-size:20px;font-weight:800;text-align:center;line-height:1.3;margin-bottom:22px;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{
    background:var(--white);border:2px solid var(--border);border-radius:11px;
    padding:13px 16px;text-align:left;font-size:14px;font-weight:500;
    color:var(--text);cursor:pointer;transition:.2s;width:100%;line-height:1.4;
  }
  .opt:hover{border-color:var(--red);background:#fff5f5;}
  .opt.sel{background:var(--red);border-color:var(--red);color:white;}
  .q-foot{text-align:center;font-size:12px;color:#ccc;margin-top:14px;}

  /* RESULTS */
  .r-tag{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--red);margin-bottom:6px;}
  .r-title{font-size:20px;font-weight:800;line-height:1.3;margin-bottom:6px;}
  .r-sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.5;}
  .gg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
  @media(max-width:420px){.gg{grid-template-columns:1fr;}}
  .gc{border:2px solid var(--border);border-radius:13px;padding:16px;position:relative;}
  .gc.p1{border-color:var(--red);padding-top:26px;}
  .badge{
    position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    background:var(--red);color:white;font-size:9px;font-weight:800;
    letter-spacing:.5px;text-transform:uppercase;padding:3px 10px;
    border-radius:20px;white-space:nowrap;
  }
  .ge{font-size:32px;display:block;margin-bottom:8px;}
  .gn{font-size:15px;font-weight:800;margin-bottom:3px;}
  .gt{font-size:11px;color:var(--red);font-weight:600;margin-bottom:7px;}
  .gd{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:10px;}
  .gm{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
  .chip{background:#f5f5f5;border-radius:20px;padding:2px 8px;font-size:10px;color:#888;}
  .gl{
    display:block;text-align:center;text-decoration:none;
    border-radius:8px;padding:8px 10px;font-size:11px;font-weight:700;transition:.2s;
  }
  .gl.pa{background:var(--red);color:white;}
  .gl.pa:hover{background:var(--red2);}
  .gl.sa{border:2px solid var(--border);color:var(--text);}
  .gl.sa:hover{border-color:var(--red);color:var(--red);}
  .btn-again{
    background:transparent;border:2px solid var(--border);border-radius:10px;
    padding:10px 22px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.2s;
  }
  .btn-again:hover{border-color:var(--red);color:var(--red);}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="brand">Piatnik Budapest</div>
    <div class="hdr-sub">Játékajánló kvíz</div>
  </div>
  <div id="app"></div>
</div>

<script>
const G = {
  memoett: {name:'Memoett', e:'🦎', tag:'Négyes memo – állatcsaládok', desc:'Nem csak két lapkát kell megtalálnod, hanem négyet, ráadásul 1-től 4-ig sorrendben. Így lesz teljes az állatcsalád.', age:'4+', p:'2–4 fő', t:'20 perc', url:'https://www.piatnik.hu/spd/674990/Memoett'},
  krokoLoko: {name:'Kroko Loko', e:'🐊', tag:'Vidám óvodás játék', desc:'Egyszerű, színes, óvodásoknak tökéletes első társasjáték.', age:'4+', p:'2–4 fő', t:'15 perc', url:'https://www.piatnik.hu/spd/673696/Kroko-Loko'},
  frogSplash: {name:'Frog Splash', e:'🐸', tag:'Csenj szúnyogot a béka elől!', desc:'Vidám akciójáték. Ki tud a legtöbb szúnyogot elcsenni a béka elől úgy, hogy az le ne fröcskölje vízsugárral?', age:'4+', p:'2–6 fő', t:'10 perc', url:'https://www.piatnik.hu/spd/811494/Frog-Splash'},
  colorChaos: {name:'Color Chaos', e:'🌈', tag:'Minden megtéveszt!', desc:'A kártyát nézed, de a keret színét kell mondani – közben semmi sem az, aminek látszik. Garantált nevetés.', age:'5+', p:'2–4 fő', t:'10 perc', url:'https://www.piatnik.hu/spd/673993/Color-Chaos'},
  superSnails: {name:'Super Snails', e:'🐌', tag:'Csigafutam – tippelős kockás', desc:'Elsőként csússzon át a szupercsigád a célon! Tippeld meg a többiek kockadobásának eredményét, és ne felejtsd el megetetni a csigákat.', age:'6+', p:'2–4 fő', t:'15 perc', url:'https://www.piatnik.hu/spd/675492/Super-Snails'},
  pickAChicken: {name:'Pick A Chicken', e:'🐔', tag:'Rendezd el a tyúkólat!', desc:'Minden szárnyasnak van saját preferenciája: a tyúkok egymás mellett, a kakas magában, a fiókák párban. Helyezd el őket ügyesen!', age:'6+', p:'2–4 fő', t:'15 perc', url:'https://www.piatnik.hu/spd/675195/Pick-A-Chicken'},
  halliGalli: {name:'Halli Galli', e:'🔔', tag:'Csengess elsőnek!', desc:'Ha pontosan 5 egyforma gyümölcs van az asztalon, csapj a csengőre! Percek alatt tanulható, mégis megőrjíti az egész asztalt.', age:'6+', p:'2–6 fő', t:'15 perc', url:'https://www.piatnik.hu/spd/738869/Halli-Galli'},
  pinkuins: {name:'Pinkuins', e:'🐧', tag:'Rózsaszín pingvines memo', desc:'Aranyos, könnyen fogható családi játék kisiskolásoknak.', age:'6+', p:'2–4 fő', t:'30 perc', url:'https://www.piatnik.hu/spd/673092/Pinkuins'},
  tickTackJunior: {name:'Tick Tack Bumm Junior', e:'💣', tag:'Ketyeg a bomba – szavak gyorsan!', desc:'Gyerekbarát témák, ketyegő bomba, rengeteg nevetés. Mondj egy szót a témára, mielőtt robban!', age:'5+', p:'2–12 fő', t:'30 perc', url:'https://www.piatnik.hu/spd/744969/Tick-Tack-Bumm-Junior'},
  activityJunior: {name:'Activity Junior', e:'🎨', tag:'Rajzolj, mutogass, magyarázz!', desc:'Az Activity gyerekverziója – könnyebb szavak, de ugyanolyan hangos és kreatív. Tökéletes 8 éves kortól.', age:'8+', p:'4–12 fő', t:'40 perc', url:'https://www.piatnik.hu/spd/744648/Activity-Junior'},
  carcassonne: {name:'Carcassonne', e:'🏰', tag:'Rakd le a csempét, nyerd a területet!', desc:'Egy csempe, egy döntés – de ezek összeadódnak. Könnyen tanulható családi klasszikus, ami mégis mélyen stratégiai.', age:'7+', p:'2–5 fő', t:'35 perc', url:'https://www.piatnik.hu/spd/791697/Carcassonne'},
  rummikub: {name:'Rummikub', e:'🔢', tag:'Szám, szín, sorozat', desc:'A klasszikus csempés számjáték, amit megszeret nagyszülő és unoka egyaránt.', age:'7+', p:'2–4 fő', t:'20 perc', url:'https://www.piatnik.hu/spd/687396/Rummikub-Szamos'},
  activityFamily: {name:'Activity Family Classic', e:'🎭', tag:'Minden korosztálynak', desc:'Mutogatás, rajzolás, magyarázat vegyes korosztályú csapatoknak. Nagymamától unokáig mindenki játszhat.', age:'8+', p:'3–16 fő', t:'60 perc', url:'https://www.piatnik.hu/spd/710773/Activity-Family-Classic'},
  verflixxt: {name:'Verflixxt! Dodófutam', e:'🦤', tag:'Kockás versenyfutás', desc:'Gyors, izgalmas családi kockajáték – nagyobb csapatnak is remek.', age:'8+', p:'2–6 fő', t:'20 perc', url:'https://www.piatnik.hu/spd/883729/Verflixxt-Dodofutam'},
  puraVida: {name:'Pura Vida', e:'🦥', tag:'Costa Rica-i vadőrködés', desc:'Vadőrként kiegyensúlyozott állatpopulációt hozol létre nemzeti parkokban. Gyönyörű, kellemes családi játék.', age:'8+', p:'2–4 fő', t:'30 perc', url:'https://www.piatnik.hu/spd/673597/Pura-Vida'},
  elixirus: {name:'Elixirus', e:'🧪', tag:'Varázsital-versenyen', desc:'Az erdei varázsló versenyén hozzávalókat gyűjtesz és főzeteket készítesz. Vigyázz a többiek trükkjeire – csak a legravaszabb győzhet!', age:'10+', p:'2–5 fő', t:'30 perc', url:'https://www.piatnik.hu/spd/674297/Elixirus'},
  catan: {name:'Catan', e:'🏗', tag:'A stratégiai örökzöld', desc:'Gyűjts nyersanyagot, építs, kereskedj – és ne hagyd, hogy a szomszédod megelőzzön. A stratégiai játékok kötelező alapdarabja.', age:'10+', p:'3–4 fő', t:'75 perc', url:'https://www.piatnik.hu/spd/794995/Catan-A-jatek'},
  apeTown: {name:'Ape Town', e:'🐒', tag:'Majomvárosi hatalomátvétel', desc:'Bandák járják a sikátorokat, értékes helyeket keresve. Célzottan használd a pénzkötegeket, szerezd meg a legjobb lapkákat!', age:'10+', p:'2–4 fő', t:'45 perc', url:'https://www.piatnik.hu/spd/783692/Ape-Town'},
  nomad: {name:'Nomad', e:'🐎', tag:'Sztyeppei nomád stratégia', desc:'Vándorolj csapatoddal a sztyeppén, foglalj területeket, gyűjts erőforrást. Hosszabb, taktikusabb családi darab.', age:'10+', p:'2–4 fő', t:'60 perc', url:'https://www.piatnik.hu/spd/723896/Nomad'},
  activityOriginal: {name:'Activity Original', e:'🎪', tag:'A legendás, felnőtteknek', desc:'Erőteljesebb témák, hangosabb viták, emlékezetes esték. A társasjátékos örökzöld.', age:'12+', p:'3–16 fő', t:'60 perc', url:'https://www.piatnik.hu/spd/737329/Activity-Original'},
  activityKaosz: {name:'Activity Káosz', e:'🌀', tag:'Egy csapatban a káoszban', desc:'Az Activity családhoz tartozó pörgős parti-változat, ahol az egész társaság egy csapatként küzd.', age:'12+', p:'4–12 fő', t:'45 perc', url:'https://www.piatnik.hu/spd/791420/Activity-Kaosz'},
  tickTackBummOriginal: {name:'Tick Tack Bumm Original', e:'💥', tag:'A klasszikus szójáték-bomba', desc:'Ketyeg a bomba, mondj gyorsan egy szót, mielőtt robban! A parti-klasszikus.', age:'12+', p:'2–12 fő', t:'20 perc', url:'https://www.piatnik.hu/spd/742262/Tick-Tack-Bumm'},
  tickTackBummSzoorveny: {name:'Tick Tack Bumm Szóörvény', e:'🌪', tag:'Szavak örvényében', desc:'A Tick Tack Bumm család gyors, kompakt tagja – rövid parti, sok nevetés.', age:'12+', p:'2–6 fő', t:'20 perc', url:'https://www.piatnik.hu/spd/701863/Tick-Tack-Bumm-Szoorveny'},
  quickStopOriginal: {name:'Quick Stop', e:'⚡', tag:'Villámgyors szójáték', desc:'Nincs idő várakozásra: a témának és a betűnek megfelelő szavakat kell bemondanod, mielőtt lerakod. Aki elsőként letett, nyer.', age:'10+', p:'2–7 fő', t:'15 perc', url:'https://www.piatnik.hu/spd/727498/Quick-Stop'},
  theCrew: {name:'The Crew Family', e:'🚀', tag:'Kooperatív ütésbecslés', desc:'Egy legénység tagjaiként küldetéseket teljesítetek. Kommunikálni alig lehet – közösen kell megoldani a feladatokat.', age:'8+', p:'3–5 fő', t:'15 perc', url:'https://www.piatnik.hu/spd/808500/The-Crew-Family'},
  theGang: {name:'The Gang', e:'💰', tag:'Kooperatív Texas Hold\'em', desc:'A The Gang tagjaiként 3 széfet raboltok ki. Nem beszélhettek, csak zsetonokkal jelezhettek – kooperatív póker.', age:'10+', p:'3–6 fő', t:'20 perc', url:'https://www.piatnik.hu/spd/808999/The-Gang'}
};

const Qs = {
  q1:  {text:'Kivel fogsz játszani?',           e:'🎲', opts:[{l:'🧒 A gyerekemmel',v:'gyerek'},{l:'👨‍👩‍👧 Az egész családdal',v:'csald'},{l:'🍻 Barátokkal',v:'barat'}]},
  q2:  {text:'Mekkora a csapat?',               e:'👥', opts:[{l:'2 játékos',v:'kis'},{l:'3–4 játékos',v:'kozepes'},{l:'5–6 játékos',v:'nagy'}]},
  q3:  {text:'Mennyi idő áll rendelkezésre?',   e:'⏱️', opts:[{l:'Gyors parti – 15–20 perc',v:'rovid'},{l:'Közepes – 30–45 perc',v:'kozepes'},{l:'Ráérünk – egy óra vagy több',v:'hosszu'}]},
  q4a: {text:'Hány éves a kis játékos?',         e:'🎂', opts:[{l:'4–6 éves',v:'4-6'},{l:'7–9 éves',v:'7-9'},{l:'10 éves fölött',v:'10plus'}]},
  q4b: {text:'Mi a hangulat?',                  e:'🎭', opts:[{l:'Hangos és kaotikus – minél több a nevetés, annál jobb',v:'hangos'},{l:'Kicsit taktikázós, de ne kelljen túl sokat gondolkodni',v:'kozepes'},{l:'Jöhet minden, ami stratégia és taktika',v:'strategia'}]},
  q5:  {text:'Mennyire legyen összetett?',       e:'🎯', opts:[{l:'🚀 Gyorsan megtanulható',v:'gyors'},{l:'⚖️ Közepes nehézségű',v:'kozepes'},{l:'🧩 Összetett játék',v:'osszetett'}]}
};

function getResult(a) {
  const {q1,q2,q3,q4,q5} = a;

  // GYEREKEKKEL
  if (q1==='gyerek') {
    if (q4==='4-6') {
      if (q5==='gyors')     return ['frogSplash','krokoLoko'];
      if (q5==='kozepes')   return ['memoett','tickTackJunior'];
      return                       ['memoett','pickAChicken'];
    }
    if (q4==='7-9') {
      if (q5==='gyors')     return ['halliGalli','frogSplash'];
      if (q5==='kozepes')   return ['tickTackJunior','pinkuins'];
      return                       ['carcassonne','pickAChicken'];
    }
    // 10+
    if (q5==='gyors')       return ['halliGalli','colorChaos'];
    if (q5==='kozepes')     return ['activityJunior','superSnails'];
    return                         ['carcassonne','rummikub'];
  }

  // CSALÁDDAL
  if (q1==='csald') {
    if (q4==='hangos') {
      if (q5==='gyors')     return ['halliGalli','frogSplash'];
      if (q5==='kozepes')   return ['activityFamily','tickTackBummSzoorveny'];
      return                       ['activityFamily','carcassonne'];
    }
    if (q4==='kozepes') {
      if (q5==='gyors')     return ['verflixxt','halliGalli'];
      if (q5==='kozepes')   return ['carcassonne','rummikub'];
      return                       ['puraVida','carcassonne'];
    }
    if (q4==='strategia') {
      if (q5==='gyors')     return ['theCrew','verflixxt'];
      if (q5==='kozepes')   return ['carcassonne','elixirus'];
      return                       ['catan','apeTown'];
    }
  }

  // BARÁTOKKAL
  if (q1==='barat') {
    if (q4==='hangos') {
      if (q5==='gyors')     return ['halliGalli','tickTackBummSzoorveny'];
      if (q5==='kozepes')   return ['activityOriginal','tickTackBummOriginal'];
      return                       ['activityOriginal','activityKaosz'];
    }
    if (q4==='kozepes') {
      if (q5==='gyors')     return ['quickStopOriginal','tickTackBummSzoorveny'];
      if (q5==='kozepes')   return ['activityKaosz','quickStopOriginal'];
      return                       ['theCrew','theGang'];
    }
    if (q4==='strategia') {
      if (q5==='gyors')     return ['theCrew','theGang'];
      if (q5==='kozepes')   return ['elixirus','apeTown'];
      return                       ['catan','nomad'];
    }
  }

  return ['activityFamily','carcassonne'];
}

let screen='start', step=0, ans={}, seq=[];

function buildSeq() {
  return ['q1','q2','q3', ans.q1==='gyerek'?'q4a':'q4b', 'q5'];
}

const app = document.getElementById('app');

function render() {
  app.innerHTML =
    screen==='start'  ? renderStart() :
    screen==='quiz'   ? renderQuiz()  :
                        renderResults();
}

function renderStart() {
  return `<div class="card">
    <span class="s-emoji">🎲</span>
    <h1 class="s-title">Melyik társasjáték illik hozzád?</h1>
    <p class="s-desc">5 gyors kérdés, és megtaláljuk a tökéletes játékot – legyen szó a gyereknek, a családnak vagy egy jó buli éjszakájának.</p>
    <button class="btn-go" onclick="startQuiz()">Kezdjük el! →</button>
    <p class="s-note">5 kérdés · ~1 perc</p>
  </div>`;
}

function renderQuiz() {
  const q = Qs[seq[step]];
  const dots = [0,1,2,3,4].map(i =>
    `<div class="dot ${i<step?'done':i===step?'active':''}"></div>`
  ).join('');
  const opts = q.opts.map(o =>
    `<button class="opt" data-v="${o.v}" onclick="pick('${o.v}')">${o.l}</button>`
  ).join('');
  return `
    <div class="dots">${dots}</div>
    <div class="card">
      <span class="q-emoji">${q.e}</span>
      <div class="q-text">${q.text}</div>
      <div class="opts">${opts}</div>
    </div>
    <p class="q-foot">${step+1} / 5</p>`;
}

function renderResults() {
  const [pk,sk] = getResult(ans);
  const pg=G[pk], sg=G[sk];
  return `<div class="card">
    <div class="r-tag">🎉 Megvan a tökéletes játék!</div>
    <h2 class="r-title">Ezeket ajánljuk neked:</h2>
    <p class="r-sub">A legjobb találat elől van – de mindkettő megér egy próbát!</p>
    <div class="gg">
      ${gc(pg,true)}
      ${gc(sg,false)}
    </div>
    <button class="btn-again" onclick="restart()">↺ Újrakezdem</button>
  </div>`;
}

function gc(g, primary) {
  return `<div class="gc ${primary?'p1':''}">
    ${primary?'<span class="badge">⭐ Legjobb találat</span>':''}
    <span class="ge">${g.e}</span>
    <div class="gn">${g.name}</div>
    <div class="gt">${g.tag}</div>
    <div class="gd">${g.desc}</div>
    <div class="gm">
      <span class="chip">🎂 ${g.age}</span>
      <span class="chip">👥 ${g.p}</span>
      <span class="chip">⏱ ${g.t}</span>
    </div>
    <a href="${g.url}" target="_blank" rel="noopener" class="gl ${primary?'pa':'sa'}">
      Megnézem →
    </a>
  </div>`;
}

function startQuiz() {
  screen='quiz'; step=0; ans={}; seq=['q1','q2','q3','_','q5'];
  render();
}

function pick(val) {
  const qk = seq[step];
  const ak = (qk==='q4a'||qk==='q4b') ? 'q4' : qk;
  ans[ak] = val;
  if (qk==='q1') seq = buildSeq();
  document.querySelectorAll('.opt').forEach(b => {
    if (b.getAttribute('data-v')===val) b.classList.add('sel');
  });
  setTimeout(() => {
    step++;
    if (step>=5) screen='results';
    render();
  }, 280);
}

function restart() {
  screen='start'; step=0; ans={}; seq=[];
  render();
}

render();
</script>
</body>
</html>
